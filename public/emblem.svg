<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded Shield Base with Gradient -->
  <defs>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="65%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0070f3" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#shieldGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2" />

  <!-- Outer Precision Radar Ring -->
  <circle cx="32" cy="32" r="26" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- Infrastructure Tri-Convergence Geometry -->
  <path 
    d="M32 8L52 46H12L32 8Z" 
    stroke="#ffffff" 
    stroke-width="3" 
    stroke-linejoin="round" 
    fill="#0070f3" 
    fill-opacity="0.25" 
  />

  <!-- Inner Compass Spoke Cross -->
  <line x1="32" y1="16" x2="32" y2="24" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  <line x1="20" y1="39" x2="27" y2="35" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  <line x1="44" y1="39" x2="37" y2="35" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />

  <!-- Central Ashoka Core Hub -->
  <circle cx="32" cy="31" r="8" fill="#ffffff" />
  <circle cx="32" cy="31" r="4.5" fill="#0070f3" />
  <circle cx="32" cy="31" r="1.8" fill="#ffffff" />

  <!-- Saffron & Green National Sovereignty Accents -->
  <circle cx="10" cy="10" r="3" fill="#ff9933" />
  <circle cx="54" cy="54" r="3" fill="#138808" />
</svg>
